<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06121f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="PES 2027 Stickman 2D - futebol arcade completo para celular e tablet." />
  <title>PES 2027 STICKMAN 2D</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306121f'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23e8f7ff'/%3E%3Cpath d='M32 17l11 8-4 13H25l-4-13z' fill='%231f79ff'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="rotate-hint" class="rotate-hint hidden">
    <div class="rotate-icon">⟳</div>
    <strong>Gire o dispositivo</strong>
    <span>Para uma experiência melhor em campo</span>
    <button id="rotate-dismiss" class="btn ghost small">Continuar assim</button>
  </div>

  <div id="stage">
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <canvas id="game-canvas" aria-hidden="true"></canvas>

    <div id="ui" class="ui"></div>

    <div id="match-hud" class="match-hud hidden" aria-live="polite">
      <div class="scorebar">
        <div class="score-team home">
          <span class="crest-mini" id="hud-home-crest"></span>
          <span class="score-abbr" id="hud-home-abbr">BRA</span>
        </div>
        <div class="score-center">
          <div class="score-line"><span id="hud-home-score">0</span><i>:</i><span id="hud-away-score">0</span></div>
          <div class="clock"><span id="hud-clock">00:00</span><em id="hud-phase">1º TEMPO</em></div>
        </div>
        <div class="score-team away">
          <span class="score-abbr" id="hud-away-abbr">ARG</span>
          <span class="crest-mini" id="hud-away-crest"></span>
        </div>
      </div>
      <div class="hud-top-right">
        <button class="hud-icon" data-hud="stats" title="Estatísticas">▥</button>
        <button class="hud-icon" data-hud="camera" title="Câmera">◉</button>
        <button class="hud-icon" data-hud="pause" title="Pausar">Ⅱ</button>
      </div>
      <div class="commentary-ticker" id="commentary-ticker"></div>
      <div class="power-wrap hidden" id="power-wrap"><div class="power-fill" id="power-fill"></div><span>FORÇA</span></div>
      <div class="replay-badge hidden" id="replay-badge"><span>REPLAY</span><small>toque para pular</small></div>
      <div class="event-banner hidden" id="event-banner"><strong id="event-main"></strong><span id="event-sub"></span></div>
      <div class="tilt-indicator hidden" id="tilt-indicator">TILT <b></b></div>
    </div>

    <div id="touch-controls" class="touch-controls hidden">
      <div class="stick-zone" id="stick-zone">
        <div class="stick-base"><div class="stick-ring"></div><div class="stick-knob" id="stick-knob"></div></div>
        <span class="stick-label">MOVER · CORRER</span>
      </div>
      <div class="action-pad">
        <button class="action btn-pass" data-action="pass"><b>PASSE</b><i>J</i></button>
        <button class="action btn-shoot" data-action="shoot"><b>CHUTE</b><i>K</i></button>
        <button class="action btn-dribble" data-action="dribble"><b>DRIBLE</b><i>L</i></button>
        <button class="action btn-tackle" data-action="tackle"><b>CARRINHO</b><i>H</i></button>
      </div>
    </div>

    <div id="toasts" class="toasts"></div>
    <div id="modal-layer" class="modal-layer hidden"></div>
    <div id="broadcast" class="broadcast hidden"></div>
  </div>

  <noscript><div class="noscript">Ative o JavaScript para jogar PES 2027 Stickman 2D.</div></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
