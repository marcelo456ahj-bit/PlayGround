<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07110e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="PES 2027 Stickman 2D — futebol completo, carreiras, copas e multiplayer em um só lugar." />
  <title>PES 2027 STICKMAN 2D</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307110e'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23c8ff3d'/%3E%3Cpath d='M32 19l10 7-4 12H26l-4-12z' fill='%2307110e'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <div class="ambient-glow glow-a"></div>
    <div class="ambient-glow glow-b"></div>
    <div class="bg-grid"></div>

    <header class="topbar" id="topbar">
      <button class="brand" data-action="nav" data-view="home" aria-label="Início">
        <span class="brand-mark"><span>P</span></span>
        <span class="brand-copy">
          <strong>PES <em>2027</em></strong>
          <small>STICKMAN 2D</small>
        </span>
      </button>
      <div class="topbar-center">
        <span class="live-dot"></span>
        <span id="topbar-context">CENTRAL DE COMANDO</span>
      </div>
      <div class="topbar-right">
        <button class="coin-pill" data-action="nav" data-view="extras" title="Créditos PES">
          <span class="coin-icon">P</span>
          <span id="coin-count">2.500</span>
        </button>
        <button class="icon-btn" data-action="open-settings" title="Configurações" aria-label="Configurações">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Zm8.4 3.5c0-.5 0-1-.1-1.5l2-1.5-2-3.4-2.4 1a8 8 0 0 0-2.6-1.5L14.9 3h-5.8l-.4 2.1A8 8 0 0 0 6.1 6.6l-2.4-1-2 3.4 2 1.5a8 8 0 0 0 0 3l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 2.6 1.5l.4 2.1h5.8l.4-2.1a8 8 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.5c.1-.5.1-1 .1-1.5Z"/></svg>
        </button>
        <button class="profile-chip" data-action="nav" data-view="career" aria-label="Perfil">
          <span class="avatar" id="profile-avatar">10</span>
          <span class="profile-meta"><b id="profile-name">COMANDANTE</b><small id="profile-level">NÍVEL 1</small></span>
        </button>
      </div>
    </header>

    <nav class="mainnav" id="mainnav" aria-label="Navegação principal">
      <button class="nav-item is-active" data-action="nav" data-view="home"><span class="nav-ico">⌂</span><span>Início</span></button>
      <button class="nav-item" data-action="nav" data-view="match"><span class="nav-ico">⚽</span><span>Partida</span></button>
      <button class="nav-item" data-action="nav" data-view="comps"><span class="nav-ico">🏆</span><span>Competições</span></button>
      <button class="nav-item" data-action="nav" data-view="career"><span class="nav-ico">★</span><span>Carreira</span></button>
      <button class="nav-item" data-action="nav" data-view="editor"><span class="nav-ico">✎</span><span>Editor</span></button>
      <button class="nav-item" data-action="nav" data-view="transfers"><span class="nav-ico">⇄</span><span>Mercado</span></button>
      <button class="nav-item" data-action="nav" data-view="extras"><span class="nav-ico">◈</span><span>Extras</span></button>
    </nav>

    <main id="screen" class="screen" tabindex="-1"></main>

    <footer class="app-footer">
      <span>PES 2027 STICKMAN 2D</span>
      <span class="footer-dash">—</span>
      <span>FOOTBALL LIVES HERE</span>
      <span class="footer-right" id="save-indicator">Salvo automaticamente</span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="match-root" class="match-root" hidden>
    <canvas id="match-canvas" aria-label="Campo de futebol"></canvas>
    <div id="match-ui" class="match-ui"></div>
  </div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div class="rotate-hint" id="rotate-hint"><span>↻</span> Gire o dispositivo para uma melhor experiência</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
